<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Writer Novel</title>
    <style>
        body {
            background: linear-gradient(43deg, black 0%, white 5%, black 10%, white 15%, black 20%, white 25%, black 75%, white 80%, black 85%, white 90%, black 95%, white 100%) no-repeat;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 600;
            height: 100vh;
        }
        .wrapper2 {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .s-p {
            position: absolute; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 1000;
        }
        .s-t {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
        }
        .s-b {
            width: 100%;
            max-width: 600px;
            height: 46px;
            border-radius: 23px;
            text-align: center;
            border: solid black;
        }
        .s-b:hover {
            box-shadow: 0 8px 12px white;
        }
        .s-b:active {
            background-color: #b3adad;
        }
        .the-begin-p {
            width: 102%;
            height: 150px;
            cursor: pointer;
            border-radius: 13px;
        }
        .the-begin-b {
            color: black;
            font-size: 1rem;
            font-weight: 600;
            font-style: oblique;
            display: flex;
            flex-direction: column;
            text-align: left;
            cursor: pointer;
        }
        .the-begin {
            display: flex;
            flex-direction: column;
            position: absolute; top: 7.3rem; left: 2.7rem;
            border: solid black;
            text-align: center;
            background-color: white;
            cursor: pointer;
            border-radius: 16px;
        }
        .the-begin:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px 12px gray;
        }
        .account-bar {
            display: flex;
            flex-direction: column;
            color: #FFCC70;
            position: absolute; top: 0.7rem; right: 0.7rem;
        }
        .account-bar-button {
            width: 60px;
            height: 60px;
            border-radius: 30px;
            border: solid black;
            background: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="wrapper2">
        <form>
            <div class="s-p">
                <label for="search-field" class="s-t">Search</label>
                <input type="search" id="search-field" name="search-field" placeholder="Search bar" class="s-b">
            </div>
            <div class="the-begin" data-model-name="the-begin">
                <a href="the-begin/page1.html" style="text-decoration: none;">
                    <img src="images/img.png" alt="The Begin Novel" class="the-begin-p">
                    <label class="the-begin-b">The Begin</label>
                    <label class="the-begin-b">Writer: None094</label>
                </a>
            </div>
            <div>
                <a href="images/back.png" style="text-decoration: none;" class="account-bar">
                <button type="button" class="account-bar-button"></button>
                <label>Account Tab</label>
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
