<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Beautiful Login with Labels</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #4158D0;
            background-image: linear-gradient(43deg, #4158D0 0%, #c850C0 46%, #FFCC70 100%);
            background-attachment: fixed;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
        }

        .login-background {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-background2 {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            color: #ffffff;
        }

        .user {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 2rem;
            letter-spacing: -0.5px;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            margin-bottom: 1.5rem;
        }

        .field-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            padding-left: 8px;
            color: rgba(255, 255, 255, 0.85);
        }

        .username2, .username3 {
            border-radius: 25px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            height: 48px;
            padding: 0 20px;
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .username2:focus, .username3:focus {
            background-color: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
        }

        .login-button {
            background-color: #ffffff;
            color: #4158D0;
            border: none;
            width: 100%;
            height: 48px;
            border-radius: 25px;
            margin-top: 1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .sing {
            color: #FFCC70;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            margin-right: 4rem;
        }

        .sing-up{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.75rem;
        }
    </style>
</head>
<body>

<div class="login-background">
    <div class="login-background2">
        <div style="display: flex; justify-content: center; align-items: center;">
            <div class="user">Create Account</div>
        </div>

        <form>
            <div class="input-wrapper">
                <label for="email-field" class="field-label">Gmail</label>
                <input type="email" id="email-field" class="username2" required>
            </div>

            <div class="input-wrapper">
                <label for="password-field" class="field-label">Password</label>
                <input type="password" id="password-field" class="username3" required>
            </div>

            <div class="input-wrapper">
                <label for="password2-field" class="field-label">Confirm Password</label>
                <input type="password" id="password2-field" class="username3" required>
            </div>

            <div>
                <button type="submit" class="login-button">Sing Up</button>
            </div>

            <div class="sing-up">
                <label class="field-label" style="margin: 0">if you have Account</label>
                <a href="index.html" class="sing">
                    Login Account
                </a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
